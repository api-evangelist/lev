authentication:
  style: bearer
  header: 'Authorization: Bearer <token>'
  credential_kinds:
  - api-key (lev_sk_ prefix, long-lived, server-to-server)
  - jwt (Auth0 RS256, short-lived, interactive clients)
  additional_required_headers:
  - name: X-Origin-App
    description: Identifies the calling application.
  - name: X-Active-Account
    description: Account slug; only for JWT users with multiple account memberships.
  artifact: authentication/lev-authentication.yml
idempotency:
  supported: true
  header: Idempotency-Key
  value_format: uuid
  applies_to: write operations (POST/PATCH/DELETE)
  operations_declaring_it: 19
  declared_in_spec_as: x-lev-headers on each write operation in
    openapi/lev-openapi-original.json
  conflict_behavior:
    status: 409
    type: conflict
    meaning: The same Idempotency-Key was replayed with a different request body.
    remediation: Reuse an identical request body for a given idempotency key, or
      generate a new key for a genuinely different request.
  retention: not published
  scope: not published
  note: The docs and spec establish the header, the uuid value format, and the 409
    conflict semantics. Key retention window and the exact key scope (per account,
    per endpoint) are not documented publicly.
pagination:
  default_style: cursor
  styles:
  - style: cursor
    when: used by default, when no `sort` parameter is supplied
    cursor_param: cursor
    cursor_format: opaque base64 token
    next_field: next_cursor
    stability: stable — no duplicates or skips
    note: Mutually exclusive with the `sort` parameter. Recommended for bulk data
      synchronization.
  - style: offset
    when: activated when a `sort` parameter is supplied
    offset_param: offset
    offset_default: 0
    stability: can skip or duplicate items if rows are inserted or deleted between
      requests
  params:
  - name: limit
    default: 50
    minimum: 1
    maximum: 200
  - name: cursor
  - name: offset
    default: 0
  - name: sort
    description: Field name; prefix with `-` for descending. Switches the endpoint
      to offset pagination.
  response_object: pagination
  response_fields:
  - total
  - limit
  - has_more
  - cursor
  - next_cursor
  - offset
filtering:
  style: bracketed filter params
  form: filter[<field>]=<value>
  range_form: filter[<field>][gte] / filter[<field>][lte]
  examples:
  - filter[loan_type]
  - filter[transaction_type]
  - filter[business_plan]
