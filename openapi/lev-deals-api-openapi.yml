  /api/external/v2/checklist-tasks:
    post:
      operationId: postChecklistTasks
      summary: Add a task to a deal's checklist
      description: 'Add a task to a deal''s checklist


        Docs page: https://www.lev.com/docs/build/deals'
      tags:
      - Deals
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              oneOf:
              - required:
                - section_id
              - required:
                - checklist_id
              - required:
                - parent_task_id
              properties:
                title:
                  type: string
                  minLength: 1
                  description: Task title. Must be non-empty.
                section_id:
                  type: integer
                  description: Add the task inside this checklist section. Provide exactly one of section_id, checklist_id, or parent_task_id.
                checklist_id:
                  type: integer
                  description: Add the task at the checklist root, outside any section. Provide exactly one of section_id, checklist_id, or parent_task_id.
                parent_task_id:
                  type: integer
                  description: Add the task as a subtask of this task (one level deep). Provide exactly one of section_id, checklist_id, or parent_task_id.
                description:
                  type: string
                  description: Optional longer detail.
                status:
                  type: string
                  enum:
                  - to_do
                  - requested
                  - reviewing
                  - updates_needed
                  - approved
                  - cancelled
                  default: to_do
                  description: Initial review state. Defaults to to_do.
                assigned_user_id:
                  type: integer
                  description: Lev user id to assign. Must be an active teammate in your account.
                due_date:
                  type: string
                  format: date
                  description: Due date, YYYY-MM-DD.
                document_type_ids:
                  type: array
                  items:
                    type: integer
                  description: Expected document type ids for the request.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  data:
                    $ref: '#/components/schemas/ChecklistTask'
        '400':
          description: assigned_user_id must belong to an active user in your account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '403':
          description: 'Missing required scope: checklists:write'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          description: Section, checklist, or parent task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Provide exactly one of section_id, checklist_id, or parent_task_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
      security:
      - bearerAuth: []
      x-lev-docs-page: https://www.lev.com/docs/build/deals
      x-lev-headers:
      - 'Authorization: Bearer <token>'
      - 'X-Origin-App: <client-name>'
      - 'Content-Type: application/json'
      - 'Idempotency-Key: <uuid>'
