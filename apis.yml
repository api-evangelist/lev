aid: lev
name: Lev
description: 'Lev is an AI platform and product system for commercial real estate (CRE)
  teams, used by sponsors, financing brokers, investment-sales brokers, lenders, capital-markets
  teams, and enterprise operators. The platform is organized in four layers: CRE apps
  (CRM, pipeline, vault/data rooms, checklists, memos, commissions), source-backed AI
  agents (Lev Agent, Lev Memo, Lender Search, Lev Match, Lev Index), CRE data (lender,
  market, contact, property, and recent-terms data), and a developer platform. That
  platform layer is the API Evangelist interest: a versioned REST API at api.lev.com
  covering deals, documents and vaults, checklists, contacts, companies, the lender
  directory, term sheets, placements, pipelines, market data, account, and billing;
  a hosted remote MCP server at mcp.lev.com with roughly 60 tools and OAuth 2.1 discovery;
  and a first-party Python CLI. The API publishes an OpenAPI 3.1 description, scoped
  API keys, cursor pagination, Idempotency-Key support on writes, request-id correlation,
  and a documented error-type and rate-limit contract.'
