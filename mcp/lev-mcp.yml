server:
  name: Lev
  transport: http
  subtype: streamable-http
  url: https://mcp.lev.com/mcp
  hosted: true
  note: Streamable HTTP with a persistent connection model — no stdio and no SSE. Clients POST to /mcp
    to invoke tools. Implemented in Python on FastMCP behind gunicorn + uvicorn.
authentication:
  model: oauth2
  provider: Auth0
  issuer: https://auth.lev.com/
  flow: authorization_code
  pkce: true
  token_format: JWT (RS256, verified via JWKS)
  dynamic_client_registration: true
  published_client_id: FPVfGZHwa9wvqhLwmXiaZyJPEjnaVAZB
  scopes:
  - openid
  - email
  discovery:
    authorization_server: https://mcp.lev.com/.well-known/oauth-authorization-server
    protected_resource: https://mcp.lev.com/.well-known/oauth-protected-resource
  session_model: Per-user, not per-service. Each session sees only the data the signed-in Lev account
    permits. The docs state MCP is designed for live interactive sessions, not headless automation — use
    the REST API with a lev_sk_ API key for server-to-server work.
resilience:
  circuit_breaker: trips after 5 consecutive 5xx responses, 30-second cooldown
  request_id_forwarding: request IDs are forwarded to the Lev backend for observability and support correlation
