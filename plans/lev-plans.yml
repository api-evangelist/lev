notes:
- Annual billing is advertised at a 20 percent saving over monthly.
- All paid plans include unlimited Lev Agent access and a shared team credit pool.
- Annual subscriptions carry monthly credit rollover.
- Credit consumption drives feature usage (AI lender searches, offering memos,
  marketing reports); the API surfaces credits via getBillingCreditsBalance and
  getBillingSummary, and credit-charging actions are gated behind the ai:actions
  scope.
- No permanent free tier is listed. A promotional offer of 3,000 free credits with
  unlimited Lev Agent through August was running when this was captured.
- The rate-limit documentation names a `free` API tier alongside `standard` and
  `enterprise`; see rate-limits/lev-rate-limits.yml.
